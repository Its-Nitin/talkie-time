<div class="container-fluid vh-100 p-0 overflow-hidden">
  <div class="row h-100 g-0">
    <div class="col-md-4 col-lg-3 border-end h-100 overflow-auto bg-white">
      <app-users
        [activeUser]="selectedUser"
        (userSelected)="onUserSelected($event)"
      ></app-users>
    </div>

    <div class="col-md-8 col-lg-9 h-100 d-flex flex-column bg-white">
      <app-chat [selectedUser]="selectedUser"></app-chat>
    </div>
  </div>
</div>
