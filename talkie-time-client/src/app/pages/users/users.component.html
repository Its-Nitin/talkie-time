<div class="container mt-4">
  <div class="dropdown align-self-end">
    <button class="btn btn-light btn-sm dropdown-toggle" data-bs-toggle="dropdown">
      ⚙
    </button>
    <ul class="dropdown-menu dropdown-menu-end">
      <li>
        <button class="dropdown-item text-danger" (click)="logout()">
          Logout
        </button>
      </li>
    </ul>
  </div>
  <h3 class="mb-3">Select User to Chat</h3>

  <div class="card shadow p-3">

    <div *ngIf="users.length === 0" class="text-muted">
      No users found
    </div>

    <ul class="list-group">
      <li
        class="list-group-item list-group-item-action d-flex justify-content-between align-items-start"
        *ngFor="let user of users"
        (click)="openChat(user)"
        style="cursor:pointer"
      >
        <span>{{ user.username }}<i *ngIf="isOnline(user.username)" class="online-dot"></i></span>
        <span class="badge bg-primary">Chat</span>
      </li>
    </ul>

  </div>

</div>
